<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Führungsvergabe</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 48px 16px; text-align: center; background: #eef1f6; color: #161b26; }
    @media (prefers-color-scheme: dark) { body { background: #11141b; color: #e7eaf1; } a { color: #8ea4f2; } }
    a { color: #2846a8; font-weight: 700; }
  </style>
  <script>
    // Unbekannte Adresse: zur App im Projektordner weiterleiten, Daten nach „#“ bleiben erhalten.
    var teil = location.pathname.split("/").filter(Boolean)[0];
    if (teil) location.replace("/" + teil + "/" + location.hash);
  </script>
</head>
<body>
  <h1>Seite nicht gefunden</h1>
  <p><a href="./">Zur Führungsvergabe</a></p>
</body>
</html>
