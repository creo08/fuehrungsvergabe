<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Führungsvergabe</title>
  <meta name="description" content="Seite nicht gefunden – weiter zur Führungsvergabe.">
  <style>
    /* Hallmark · checked: 2026-11-02 · genre: modern-minimal (inferred) · shape: app screen
     * floor: 0 FAIL · fixed: 3 (34, 48, 26a) · structural: 0 printed
     * built: the project · redesign: polish · v2.0.0 */
    :root { --bg: #eef1f6; --fg: #161b26; --accent: #2846a8; --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11141b; --fg: #e7eaf1; --accent: #8ea4f2; } }
    html, body { overflow-x: clip; }
    body { font: 16px/1.5 var(--f-body); margin: 0; padding: 48px 16px; text-align: center; background: var(--bg); color: var(--fg); }
    a { color: var(--accent); font-weight: 700; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    a:hover { text-decoration-thickness: 2px; }
    a:active { opacity: .8; }
  </style>
  <script>
    // Unbekannte Adresse: zur App im Projektordner weiterleiten, Daten nach „#“ bleiben erhalten.
    var teil = location.pathname.split("/").filter(Boolean)[0];
    if (teil) location.replace("/" + teil + "/" + location.hash);
  </script>
</head>
<body>
  <h1>Seite nicht gefunden</h1>
  <p><a href="./">Zur Führungsvergabe</a></p>
</body>
</html>
